<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ══════════ 环境 ══════════ */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOBILE  = matchMedia('(pointer: coarse)').matches || innerWidth < 760;
const $ = s => document.querySelector(s);
const tip = $('#tip'), panel = $('#panel'), toast = $('#toast');

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $('#stage'), antialias: true });
} catch (e) {
  $('#ov-msg').textContent = '这台设备不支持 WebGL，无法开门迎客。';
  $('#ov-bar').style.width = '100%'; $('#ov-bar').style.background = '#A64B4B';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.6 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.03;
renderer.shadowMap.enabled = !MOBILE;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

/* 环境反射：给漆木 / 黄铜真实的柔和高光 */
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;

const DAY_BG = new THREE.Color('#E9DFC8'), NIGHT_BG = new THREE.Color('#0E121B');
scene.background = DAY_BG.clone();
scene.fog = new THREE.Fog(DAY_BG.clone(), 18, 42);

const camera = new THREE.PerspectiveCamera(44, innerWidth / innerHeight, .1, 90);
camera.position.set(6.3, 3.0, 5.7);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.3, 0);
controls.enableDamping = true; controls.dampingFactor = .06;
controls.minDistance = 1.6; controls.maxDistance = 7.6;
controls.maxPolarAngle = Math.PI / 2 - .05;
controls.enablePan = true; controls.screenSpacePanning = true;
controls.autoRotateSpeed = .3;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* 调试 / 导览钩子 */
window.__lib = { camera, controls, renderer, THREE, scene,
  get labels(){ return labelMeshes; }, get books(){ return BOOKS_ALL; }, get pages(){ return pages; }, get hover(){ return hoverIdx; }, get bookMesh(){ return bookMesh; },
  open: i => openPanel(i), close: () => closePanel(),
  get pres(){ return { book: presBook, t0: presT0, visible: present.visible }; },
  flyTo(px, py, pz, tx = 0, ty = 1.3, tz = 0) {
    camera.position.set(px, py, pz);
    controls.target.set(tx, ty, tz);
    controls.update();
  } };

/* ══════════ 灯光 ══════════ */
const hemi = new THREE.HemisphereLight('#FFF4DC', '#7E6A4C', .38);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#FFDFAC', 2.15);
sun.position.set(-9.5, 6.8, 3.4);
sun.castShadow = !MOBILE;
if (!MOBILE) {
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -11; sun.shadow.camera.right = 11;
  sun.shadow.camera.top = 11;  sun.shadow.camera.bottom = -11;
  sun.shadow.camera.far = 40; sun.shadow.bias = -.00035; sun.shadow.normalBias = .03;
}
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight('#C9D8EE', .22);
fill.position.set(8, 7, 9); scene.add(fill);
const glow = new THREE.PointLight('#FFE7BD', .4, 22, 2);   // 房间中央柔和补光
glow.position.set(0, 3.1, 0); scene.add(glow);
const lampLight = new THREE.PointLight('#FFC978', 0, 7, 2);
lampLight.position.set(-.25, 1.34, .05);

/* ══════════ 程序化贴图 ══════════ */
function canvasTex(w, h, draw, repeat = [1, 1]) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat);
  t.anisotropy = 8;
  return t;
}
function noise(g, w, h, n, alpha) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = `rgba(${40 + Math.random()*40|0},${28 + Math.random()*30|0},14,${alpha * Math.random()})`;
    g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
}
const floorTex = canvasTex(512, 512, (g, w, h) => {
  const rows = 10, rh = h / rows;
  for (let y = 0; y < rows; y++) {
    g.fillStyle = ['#96795B', '#8E7154', '#9C7F60', '#8A6C4E'][y % 4];
    g.fillRect(0, y * rh, w, rh - 1);
    g.fillStyle = 'rgba(58,42,26,.35)'; g.fillRect(0, y * rh + rh - 1.5, w, 1.5);
    g.fillStyle = 'rgba(255,240,210,.12)'; g.fillRect(0, y * rh, w, 1);
    for (let i = 0; i < 30; i++) {
      g.strokeStyle = `rgba(70,52,32,${.05 + Math.random() * .08})`;
      g.lineWidth = 1; g.beginPath();
      const x = Math.random() * w, yy = y * rh + 2;
      g.moveTo(x, yy); g.bezierCurveTo(x + 6, yy + rh * .4, x - 6, yy + rh * .7, x + 3, yy + rh - 2);
      g.stroke();
    }
  }
  noise(g, w, h, 500, .1);
}, [8, 8]);
const plasterTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#EFE5CF'; g.fillRect(0, 0, w, h);
  noise(g, w, h, 900, .06);
}, [3, 1.4]);
const walnutTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#5E4226'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 46; i++) {
    g.strokeStyle = `rgba(38,25,12,${.1 + Math.random() * .14})`;
    g.lineWidth = 1 + Math.random() * 2.2; g.beginPath();
    const y = Math.random() * h;
    g.moveTo(0, y); g.bezierCurveTo(w * .3, y + 5, w * .62, y - 5, w, y + 2); g.stroke();
  }
  for (let i = 0; i < 14; i++) {

const BOOK_DEPTH = .2;
const AT = { CW: 96, CH: 256, AW: 1024, AH: 4096, COLS: 10, ROWS: 16, PER: 160 };

function faceVec(ry) { return new THREE.Vector3(Math.sin(ry), 0, Math.cos(ry)); }

function buildAtlases(list) {
  const { CW, CH, AW, AH, COLS, ROWS, PER } = AT;
  const nPages = Math.ceil(list.length / PER);
  const texs = [];
  for (let p = 0; p < nPages; p++) {
    const cv = document.createElement('canvas'); cv.width = AW; cv.height = AH;
    const g = cv.getContext('2d');
    for (let k = 0; k < PER && p * PER + k < list.length; k++) {
      const bk = list[p * PER + k];
      const col = k % COLS, row = (k / COLS) | 0;
      const x0 = col * CW, y0 = row * CH;
      const gr = g.createLinearGradient(x0, 0, x0 + CW, 0);
      gr.addColorStop(0, 'rgba(255,246,220,.10)'); gr.addColorStop(.5, 'rgba(255,246,220,.16)'); gr.addColorStop(1, 'rgba(255,246,220,.10)');
      g.fillStyle = gr; g.fillRect(x0, y0, CW, CH);
      g.strokeStyle = 'rgba(201,162,39,.95)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(x0+10, y0+14); g.lineTo(x0+CW-10, y0+14); g.stroke();
      g.beginPath(); g.moveTo(x0+10, y0+CH-16); g.lineTo(x0+CW-10, y0+CH-16); g.stroke();
      g.fillStyle = 'rgba(201,162,39,.95)';
      g.save(); g.translate(x0 + CW/2, y0 + 26); g.rotate(Math.PI/4); g.fillRect(-3, -3, 6, 6); g.restore();
      const title = bk.title;
      const hasCJK = /[\u4e00-\u9fff\u3400-\u4dbf]/.test(title);
      g.fillStyle = 'rgba(28,20,12,.95)';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      if (hasCJK) {
        const chars = [...title], usable = CH - 66;
        const fs = Math.max(9, Math.min(23, usable / chars.length / 1.12));
        g.font = `600 ${fs}px "PingFang SC","Microsoft YaHei",serif`;
        const total = chars.length * fs * 1.12;
        let y = y0 + 34 + Math.max(0, (usable - total) / 2) + fs * .58;
        for (const ch of chars) { g.fillText(ch, x0 + CW/2, y); y += fs * 1.12; }
      } else {
        const usable = CH - 66, est = title.length * 9.4;
        const fs = Math.max(9.5, Math.min(19, usable / Math.max(est, 1) * 19));
        g.font = `600 ${fs}px Georgia,"Times New Roman",serif`;
        g.save(); g.translate(x0 + CW/2, y0 + CH/2 + 6); g.rotate(-Math.PI/2);
        if (g.measureText(title).width > usable) {
          let t = title;
          while (t.length > 2 && g.measureText(t + '…').width > usable) t = t.slice(0, -1);
          g.fillText(t + '…', 0, 0);
        } else g.fillText(title, 0, 0);
        g.restore();
      }
      bk._cell = { page: p, col, row };
    }
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
    tex.flipY = false;
    texs.push(tex);
  }
  return texs;
}

    g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(maxQ * 4 * 2), 2));
    const idx = new Uint32Array(maxQ * 6);
    for (let q = 0; q < maxQ; q++) idx.set([q*4, q*4+3, q*4+2,  q*4, q*4+2, q*4+1], q * 6);
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    const mat = new THREE.MeshBasicMaterial({ map: pages[p], transparent: true, alphaTest: .06, side: THREE.FrontSide });
    const mesh = new THREE.Mesh(g, mat);
    mesh.frustumCulled = false;
    scene.add(mesh);
    meshes.push({ mesh, pos: g.attributes.position, uvAttr: g.attributes.uv });
  }
  return meshes;
}

function assignUVs(list) {
  const { CW, CH, AW, AH, COLS } = AT;
  list.forEach(bk => {
    const { page, col, row } = bk._cell;
    const u0 = (col * CW + 4) / AW, u1 = (col * CW + CW - 4) / AW;
    const vT = (row * CH + 4) / AH, vB = ((row + 1) * CH - 4) / AH;
    const uv = labelMeshes[page].uvAttr.array, o = bk._quad * 8;
    uv[o]=u0; uv[o+1]=vT;  uv[o+2]=u1; uv[o+3]=vT;
    uv[o+4]=u1; uv[o+5]=vB; uv[o+6]=u0; uv[o+7]=vB;
    labelMeshes[page].uvAttr.needsUpdate = true;
  });
}

function slotWorld(sl) {
  const u = UNITS[sl.u], c = Math.cos(u.ry), s = Math.sin(u.ry);
  const lx = sl.x, lz = UD/2 - BOOK_DEPTH/2 - .03;
  return { x: u.x + lx * c + lz * s, y: boardY(sl.b) + .025, z: u.z - lx * s + lz * c };
}

function shelfLayoutFor(list) {
  const out = [], N = UNITS.length * BOARDS, gap = .02;
  const base = Math.floor(list.length / N), extra = list.length % N;
  let cursorIndex = 0;
  for (let s = 0; s < N; s++) {
    const n = base + (s < extra ? 1 : 0);
    if (!n) continue;
    const widths = list.slice(cursorIndex, cursorIndex + n).map(b => b.th);
    const total = widths.reduce((a, b) => a + b, 0) + gap * (n - 1);
    let cursor = -total / 2;
    for (let j = 0; j < n; j++) {
      const th = widths[j];
      out[cursorIndex] = { u: Math.floor(s / BOARDS), b: s % BOARDS, x: cursor + th / 2, tilt: 0 };
      cursor += th + gap;
      cursorIndex++;
    }
  }
  return out;
}

function writeLabel(i) {
  const bk = BOOKS_ALL[i], L = labelMeshes[bk._cell.page], cur = bk.cur;
  const hw = (cur.s * bk.th) / 2 + .007, hh = (cur.s * bk.h * .8) / 2;
  const off = cur.s * BOOK_DEPTH / 2 + .006;
  const q = bk._q;
  const P = L.pos.array, o = bk._quad * 12;
  for (let k = 0; k < 4; k++) {
    const lx = (k === 0 || k === 3) ? -hw : hw;
    const ly = (k < 2) ? hh : -hh;
    _v.set(lx, ly, off).applyQuaternion(q).add(cur.p);
    P[o + k*3] = _v.x; P[o + k*3 + 1] = _v.y; P[o + k*3 + 2] = _v.z;
  }
  L.pos.needsUpdate = true;
}

let tweenK = 1, waveT = 0;
let presBook = null, presT0 = 0;
function restoreBook() {
  if (!presBook) return;
  const b = presBook;
  if (b._shelfTgt) { b.tgt.p.copy(b._shelfTgt.p); b.tgt.ry = b._shelfTgt.ry; b.tgt.s = b._shelfTgt.s; }
  presBook = null; presT0 = 0;
  present.visible = false;
}
function updatePresent(now) {
  if (!present.visible) return;
  const t = now - presT0;
  const k = Math.max(0, Math.min(1, (t - 320) / 700));
  const e = REDUCED ? 1 : 1 - Math.pow(1 - k, 3);
  const ang = 1.02 * e * (REDUCED ? 1 : (k < 1 ? 1 + Math.sin(k * Math.PI) * .1 : 1));
  leftPivot.rotation.y = -ang;  rightPivot.rotation.y = ang;
  leftPagesP.rotation.y = -ang * .76; rightPagesP.rotation.y = ang * .76;
  present.scale.setScalar(.25 + .75 * Math.min(1, t / 450));
  present.position.y = presBaseY + (REDUCED ? 0 : Math.sin(now * .0016) * .02);
  present.rotation.y = Math.atan2(camera.position.x - present.position.x, camera.position.z - present.position.z)
                     + (REDUCED ? 0 : Math.sin(now * .0009) * .05);
  if (presBook && t > 380 && presBook.tgt.s > .01) presBook.tgt.s = .0001;   // 原书收走，由展示书接棒
}
function writeBook(i) {
  const bk = BOOKS_ALL[i], cur = bk.cur, tgt = bk.tgt;
  cur.p.lerp(tgt.p, tweenK);
  cur.s += (tgt.s - cur.s) * tweenK;
  cur.ry += (tgt.ry - cur.ry) * tweenK;
  let wob = 0;
  if (waveT) {
    const t = (performance.now() - waveT) / 1000;
    if (t < 2.4) wob = Math.sin(i * .35 - t * 9) * Math.exp(-t * 1.9) * .085;
    else waveT = 0;
  }
  _qy.setFromAxisAngle(_v.set(0, 1, 0), cur.ry);
  _qz.setFromAxisAngle(_v.set(0, 0, 1), bk._tilt || 0);
  bk._q.copy(_qy).multiply(_qz);
  dummy.position.set(cur.p.x, cur.p.y + Math.max(0, wob), cur.p.z);
  dummy.quaternion.copy(bk._q);
  dummy.scale.set(cur.s * bk.th, cur.s * bk.h, cur.s * BOOK_DEPTH);
  dummy.updateMatrix();
  bookMesh.setMatrixAt(i, dummy.matrix);
  /* 纸页切口：略窄的奶油色块，顶部露出一线纸页 */
  dummy.scale.set(cur.s * bk.th * .86, cur.s * bk.h * 1.012, cur.s * BOOK_DEPTH * .9);
  dummy.updateMatrix();
  pageMesh.setMatrixAt(i, dummy.matrix);
  writeLabel(i);
}

/* ══════════ 数据 → 场景 ══════════ */
async function buildLibrary(data) {
  const list = data.books;
  list.forEach((b, i) => {
    const st = Math.max(0, b.stars || 0);
    b.th = .14 + ((i * 71) % 10) / 10 * .06;
    b.h  = .5 + ((i * 97) % 13) / 13 * .1;
  });

  const catOrder = Object.keys(data.palette);
  const buckets = catOrder.map(c => list.filter(b => b.category === c)
    .sort((a,b) => (a.subcategory||'').localeCompare(b.subcategory||'','zh') || a.title.localeCompare(b.title,'zh')));
  const sorted = [];
  while (buckets.some(b => b.length)) {
    buckets.forEach(b => { if (b.length) sorted.push(b.shift()); });
  }
  BOOKS_ALL = sorted;

  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mat = new THREE.MeshStandardMaterial({ roughness: .58, metalness: .04, envMapIntensity: .12 });
  bookMesh = new THREE.InstancedMesh(geo, mat, sorted.length);
  bookMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  bookMesh.castShadow = !MOBILE; bookMesh.receiveShadow = !MOBILE;
  bookMesh.frustumCulled = false;
  scene.add(bookMesh);
  pageMesh = new THREE.InstancedMesh(geo, M.paper, sorted.length);
  pageMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  pageMesh.castShadow = false; pageMesh.receiveShadow = false;
  pageMesh.frustumCulled = false;
  scene.add(pageMesh);

  sorted.forEach((b, i) => {
    b.idx = i;
    const c = new THREE.Color(b.color);
    c.offsetHSL(((i * 37) % 7 - 3) * .006, 0, ((i * 53) % 9 - 4) * .014 - .02);
    b.base = c;
    bookMesh.setColorAt(i, c);
    b.cur = { p: new THREE.Vector3(0, -3.2, 0), s: 1, ry: 0 };
    b.tgt = { p: new THREE.Vector3(), s: 1, ry: 0 };
    b._tilt = 0; b._q = new THREE.Quaternion();
  });
  bookMesh.instanceColor.needsUpdate = true;

  pages = buildAtlases(sorted);
  labelMeshes = makeLabelMeshes();
  let qc = pages.map(() => 0);
  sorted.forEach(b => { b._quad = qc[b._cell.page]++; });
  assignUVs(sorted);

  applyFilters();
}

let state = { cat: null, kind: null, q: '', sort: 'shelf' };
function reShelve() {
  const slots = shelfLayoutFor(visible);
  const snap = document.hidden || REDUCED;   // 后台标签 / 减少动态：直接落架，避免 rAF 暂停时空馆
  visible.forEach((b, i) => {
    const w = slotWorld(slots[i]);
    b.tgt.p.set(w.x, w.y + b.h / 2, w.z);
    b.tgt.ry = UNITS[slots[i].u].ry;
    b.tgt.s = 1;
    b._tilt = slots[i].tilt || 0;
    if (snap) { b.cur.p.copy(b.tgt.p); b.cur.s = 1; b.cur.ry = b.tgt.ry; }
  });
  const visSet = new Set(visible);
  BOOKS_ALL.forEach(b => { if (!visSet.has(b)) { b.tgt.s = .0001; if (snap) b.cur.s = .0001; } });
}

function applyFilters() {
  if (selectIdx >= 0) closePanel();
  let list = BOOKS_ALL;
  if (state.cat) list = list.filter(b => b.category === state.cat);
  if (state.kind) list = list.filter(b => b.kind === state.kind);
  if (state.q.trim()) {
    const q = state.q.trim().toLowerCase();
    list = list.filter(b =>
      b.title.toLowerCase().includes(q) ||
      (b.desc || '').toLowerCase().includes(q) ||
      (b.category || '').toLowerCase().includes(q));
  }
  if (state.sort === 'name') list = [...list].sort((a, b) => a.title.localeCompare(b.title, 'zh'));
  else if (state.sort === 'updated') list = [...list].sort((a, b) => (b.updated || '').localeCompare(a.updated || '') || a.title.localeCompare(b.title, 'zh'));
  else if (state.sort === 'stars') list = [...list].sort((a, b) => (b.stars || 0) - (a.stars || 0));
  visible = list;
  reShelve();
  $('#count').textContent = visible.length === BOOKS_ALL.length
    ? `在架 ${BOOKS_ALL.length} 件`
    : `在架 ${visible.length} / ${BOOKS_ALL.length} 件`;
  syncChips();
}

/* ══════════ 筛选 UI ══════════ */
const KIND_LABEL = { shelf: '📚 在架', workshop: '🛠 工作台', offline: '📦 下线', reference: '📎 参考' };
function buildChips() {
  const box = $('#chips');
  const mk = (label, dot, act, data) => {
    const el = document.createElement('button');
    el.className = 'chip'; el.type = 'button';
    el.innerHTML = (dot ? `<i class="dot" style="background:${dot}"></i>` : '') + label;
    Object.assign(el.dataset, data || {});
    el.onclick = act;
    box.appendChild(el); return el;
  };
  mk(`全部 · ${BOOKS_ALL.length}`, null, () => { state.cat = null; state.kind = null; applyFilters(); }, { all: '1' });
  for (const k of ['shelf', 'workshop', 'offline', 'reference']) {
    const n = BOOKS_ALL.filter(b => b.kind === k).length;
    if (!n) continue;
    mk(`${KIND_LABEL[k]} · ${n}`, null, () => { state.kind = state.kind === k ? null : k; state.cat = null; applyFilters(); }, { kind: k });
  }
  for (const [name, p] of Object.entries(DATA_PALETTE)) {
    const n = BOOKS_ALL.filter(b => b.category === name).length;
    mk(`${p.emoji} ${name} · ${n}`, p.color, () => { state.kind = null; state.cat = state.cat === name ? null : name; applyFilters(); }, { cat: name });
  }
  const want = new URLSearchParams(location.search).get('cat');
  if (want) {
    const hit = [...box.children].find(c => c.dataset.cat === want || c.textContent.includes(want));
    if (hit) hit.click();
  }
}
function syncChips() {
  [...$('#chips').children].forEach(c => {
    let on;
    if (c.dataset.all) on = !state.cat && !state.kind;
    else if (state.cat) on = c.dataset.cat === state.cat;
    else if (state.kind) on = c.dataset.kind === state.kind;
    else on = false;
    c.classList.toggle('active', !!on);
  });
}

$('#search').addEventListener('input', e => { state.q = e.target.value; clearTimeout(window._st); window._st = setTimeout(applyFilters, 140); });
$('#sort').addEventListener('change', e => { state.sort = e.target.value; applyFilters(); });

/* ══════════ 拾取 / 详情卡 ══════════ */
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2(-2, -2);
let hoverIdx = -1, selectIdx = -1, mouseMoved = false, downXY = null, dragMoved = false;
const BRASS = new THREE.Color('#C9A227');
function setColor(i, c) { bookMesh.setColorAt(i, c); bookMesh.instanceColor.needsUpdate = true; }

renderer.domElement.addEventListener('pointermove', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px';
  mouseMoved = true;
});
renderer.domElement.addEventListener('pointerdown', e => { downXY = [e.clientX, e.clientY]; dragMoved = false; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downXY) return;
  dragMoved = Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]) > 6;
  downXY = null;
  const hitIdx = hoverIdx;
  tip.style.display = 'none'; hoverIdx = -1;
  if (dragMoved) return;
  if (hitIdx >= 0) {
    const b = BOOKS_ALL[hitIdx];
    try { window.open(b.url, '_blank', 'noopener'); } catch (e) { /* 拦截时侧卡里仍有链接 */ }
    openPanel(hitIdx);
  } else closePanel();
});

function doRaycast() {
  if (!mouseMoved || !bookMesh) return;
  mouseMoved = false;
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObject(bookMesh, false)[0];
  const idx = hit ? hit.instanceId : -1;
  if (idx === hoverIdx) return;
  if (hoverIdx >= 0) setColor(hoverIdx, selectIdx === hoverIdx ? BRASS : BOOKS_ALL[hoverIdx].base);
  hoverIdx = idx;
  if (idx >= 0) {
    const b = BOOKS_ALL[idx];
    if (selectIdx !== idx) setColor(idx, b.base.clone().offsetHSL(0, .05, .12));
    tip.style.display = 'block';
    tip.innerHTML = `<div class="t">${b.title}</div><div class="c">${b.emoji} ${b.category}${b.subcategory ? ' · ' + b.subcategory : ''}</div>`;
    renderer.domElement.style.cursor = 'pointer';
  } else {
    tip.style.display = 'none';
    renderer.domElement.style.cursor = '';
  }
}

function openPanel(i) {
  const b = BOOKS_ALL[i];
  if (selectIdx >= 0 && selectIdx !== i) { setColor(selectIdx, BOOKS_ALL[selectIdx].base); restoreBook(); }
  selectIdx = i; setColor(i, BRASS);
  $('#spine-bar').style.background = b.color;
  $('#p-title').textContent = b.title;
  const kindName = { shelf: '📚 在架', workshop: '🛠 工作台', offline: '📦 下线', reference: '📎 参考' }[b.kind] || b.kind;
  $('#p-meta').innerHTML =
    `<span class="tag kind">${kindName}</span>` +
    `<span class="tag">${b.emoji} ${b.category}${b.subcategory ? ' · ' + b.subcategory : ''}</span>` +
    (b.lang ? `<span class="tag">🛠 ${b.lang}</span>` : '') +
    (b.stars ? `<span class="tag">⭐ ${Number(b.stars).toLocaleString()}</span>` : '') +
    (b.updated ? `<span class="tag">🕘 ${b.updated}</span>` : '');
  $('#p-desc').textContent = b.desc || '（这件作品暂无简介，欢迎点开探索。）';
  $('#go').href = b.url;
  panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false');
  /* 抽出这本书，展示书接棒翻开 */
  const f = faceVec(b.tgt.ry);
  b._shelfTgt = { p: b.tgt.p.clone(), ry: b.tgt.ry, s: b.tgt.s };
  const pulled = b.tgt.p.clone().addScaledVector(f, .55);
  b.tgt.p.copy(pulled); b.tgt.s = 1.22;
  presBook = b; presT0 = performance.now();
  present.position.copy(pulled).addScaledVector(f, .8);
  present.position.y = presBaseY = 1.45;
  presCoverMat.color.copy(b.base);
  presSpineMat.color.copy(b.base).multiplyScalar(.6);
  leftPivot.rotation.y = rightPivot.rotation.y = 0;
  leftPagesP.rotation.y = rightPagesP.rotation.y = 0;
  present.visible = true;
}
function closePanel() {
  if (selectIdx >= 0) { setColor(selectIdx, BOOKS_ALL[selectIdx].base); selectIdx = -1; }
  restoreBook();
  panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true');
}
$('#close').onclick = closePanel;
addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

function showToast(msg) {
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(window._tt); window._tt = setTimeout(() => toast.classList.remove('show'), 2600);
}

/* 彩蛋：铜铃 = 书浪；台灯 = 夜读 */
let night = false, lerpLight = 0;
renderer.domElement.addEventListener('click', e => {
  if (dragMoved) return;
  ray.setFromCamera(new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1), camera);
  const hit = ray.intersectObjects([bell, lampShade], false)[0];
  if (!hit) return;
  if (hit.object === bell) {
    if (REDUCED) { showToast('🤫 已开启减少动态，书们礼貌地没有跳。'); return; }
    waveT = performance.now(); showToast('🔔 叮 — 书浪穿过书架');
  } else {
    night = !night;
    document.body.classList.toggle('night', night);
    showToast(night ? '🌙 夜读模式' : '☀️ 晨读模式');
  }
});

/* ══════════ 主循环 ══════════ */
let lastAct = performance.now();
['pointerdown', 'pointermove', 'wheel', 'keydown'].forEach(ev =>
  addEventListener(ev, () => { lastAct = performance.now(); }, { passive: true }));

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  tweenK = REDUCED ? 1 : 1 - Math.exp(-8.2 * dt);

  if (bookMesh) {
    for (let i = 0; i < BOOKS_ALL.length; i++) writeBook(i);
    bookMesh.instanceMatrix.needsUpdate = true;
    pageMesh.instanceMatrix.needsUpdate = true;
  }

  lerpLight += ((night ? 1 : 0) - lerpLight) * (REDUCED ? 1 : .04);
  const L = lerpLight;
  scene.background.lerpColors(DAY_BG, NIGHT_BG, L);
  scene.fog.color.copy(scene.background);
  sun.intensity = 2.15 * (1 - L) + .06;
  hemi.intensity = .38 * (1 - L) + .08;
  glow.intensity = .4 * (1 - L) + .05;
  lampLight.intensity = 3.2 * L;
  M.pane.emissiveIntensity = .75 * (1 - L) + .1;
  M.wall.color.lerpColors(WALL_DAY, WALL_NIGHT, L);
  M.floor.color.lerpColors(FLOOR_DAY, FLOOR_NIGHT, L);

  if (dust) {
    const pos = dust.geometry.attributes.position;
    const t = performance.now() * .0002;
    for (let i = 0; i < pos.count; i++) {
      pos.array[i*3+1] += Math.sin(t + i * 1.7) * .0007;
      pos.array[i*3]   += Math.cos(t * .6 + i) * .0005;
    }
    pos.needsUpdate = true;
  }

  updatePresent(performance.now());
  if (!REDUCED) controls.autoRotate = performance.now() - lastAct > 14000 && !panel.classList.contains('open');
  controls.update();
  doRaycast();
  renderer.render(scene, camera);
}

function entrance() {
  if (REDUCED) { camera.position.set(4.6, 2.4, 3.8); return; }
  const from = camera.position.clone(), to = new THREE.Vector3(4.6, 2.4, 3.8);
  const t0 = performance.now(), D = 2200;
  (function step() {
    const k = Math.min(1, (performance.now() - t0) / D);
    const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(from, to, e);
    camera.position.y += Math.sin(e * Math.PI) * .12;
    if (k < 1) requestAnimationFrame(step);
  })();
}

/* ══════════ 启动 ══════════ */
let DATA_PALETTE = null;
(async function init() {
  const bar = $('#ov-bar'), msg = $('#ov-msg');
  try {
    msg.textContent = '正在取书单…'; bar.style.width = '12%';
    const data = JSON.parse(document.getElementById('book-data').textContent);
    if (!data.books || !data.books.length) {
      msg.innerHTML = '书单为空，无法开馆。';
      bar.style.width = '100%';
      return;
    }
    DATA_PALETTE = data.palette;
    if (data.counts) {
      const ownCount = data.counts.own ?? (data.counts.pinned + data.counts.original + data.counts.fork);
      const refCount = data.counts.references ?? data.counts.library ?? 0;
      const brand = $('#brand span');
      if (brand) brand.textContent = `bear20252026 · ${ownCount} 件作品 · ${refCount ? refCount + ' 参考' : '六架'}`;
    }
    msg.textContent = `正在雕刻 ${data.books.length} 个书脊…`; bar.style.width = '45%';
    await new Promise(r => setTimeout(r, 30));
    await buildLibrary(data);
    buildChips();
    syncChips();
    bar.style.width = '92%';
    msg.textContent = '开门迎客…';
    await new Promise(r => setTimeout(r, 150));
    bar.style.width = '100%';
    const overlay = $('#overlay');
    overlay.classList.add('hide');
    overlay.style.display = 'none';
    entrance();
    showToast(`🏛️ 开馆 — 共 ${data.books.length} 件作品`);
  } catch (err) {
    console.error(err);
    msg.innerHTML = '书单加载失败：' + (err.message || '网络问题') +
      '<br>请从服务器访问本页（如 GitHub Pages 或 <code>npx serve</code>），然后重试。';
    bar.style.width = '100%'; bar.style.background = '#A64B4B';
    const btn = document.createElement('button');
    btn.textContent = '重试'; btn.onclick = () => location.reload();
    $('#ov-card').appendChild(btn);
  }
})();
animate();
</script>
